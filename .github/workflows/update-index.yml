name: Update lab index

on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lab-index-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository_owner == 'dydojopka' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Reconcile and publish
        run: python -m lab_index --publish
        env:
          LABS_READ_TOKEN: ${{ secrets.LABS_READ_TOKEN }}
          INDEX_WRITE_TOKEN: ${{ github.token }}
